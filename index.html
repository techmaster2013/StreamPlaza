<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0f">
  <title>StreamPlaza</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#">StreamPlaza</a>
    <div class="top-actions">
      <label class="add-btn" for="videoInput">＋ Add videos</label>
      <input id="videoInput" type="file" accept="video/mp4,video/webm,video/quicktime" multiple hidden>
      <button id="clearBtn" class="ghost-btn" type="button">Clear library</button>
    </div>
  </header>

  <main>
    <section class="hero">
      <div>
        <p class="eyebrow">YOUR LOCAL STREAMING LIBRARY</p>
        <h1>Your videos.<br><span>Your plaza.</span></h1>
        <p class="hero-copy">A private, browser-based media library. Your videos stay on this device.</p>
        <label class="hero-btn" for="videoInput">＋ Add videos</label>
      </div>
    </section>

    <section class="library-section">
      <div class="section-head">
        <div>
          <p class="eyebrow">LIBRARY</p>
          <h2>All videos</h2>
        </div>
        <input id="searchInput" class="search" type="search" placeholder="Search videos…">
      </div>
      <div id="library" class="library-grid"></div>
      <div id="emptyState" class="empty-state">
        <div class="empty-icon">▶</div>
        <h3>Your library is empty</h3>
        <p>Add some MP4s and they'll appear here.</p>
      </div>
    </section>
  </main>

  <div id="player" class="player hidden" aria-hidden="true">
    <div class="player-backdrop"></div>
    <div class="player-panel">
      <button id="closePlayer" class="close-btn" type="button" aria-label="Close player">×</button>
      <video id="video" controls playsinline></video>
      <div class="player-info">
        <p class="eyebrow">NOW PLAYING</p>
        <h2 id="playerTitle"></h2>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
